apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: aws-lbc
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: "1.14.0"
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/kubernetes/aws-load-balancer-controller/values.yml

    - repoURL: https://github.com/nabilislam30/2048-eks-platform.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true