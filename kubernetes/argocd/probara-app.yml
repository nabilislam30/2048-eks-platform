apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: probara
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: probara

  sources:
    - repoURL: https://github.com/nabilislam30/probara.git
      targetRevision: feat/eks-integration
      path: helm/monitoring-platform
      helm:
        releaseName: probara
        valueFiles:
          - $values/kubernetes/probara/values.yml

    - repoURL: https://github.com/nabilislam30/2048-eks-platform.git
      targetRevision: feat/probara-upgrade
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true