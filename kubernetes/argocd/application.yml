apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: 2048-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/nabilislam30/2048-eks-platform.git
    targetRevision: main
    path: kubernetes/app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true